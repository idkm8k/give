{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigonometry Lesson</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div id="lesson-container" class="bg-white shadow-2xl rounded-3xl p-8 max-w-2xl w-full text-center">
    <h1 class="text-3xl font-bold text-indigo-700 mb-4">Trigonometry Lesson</h1>
    <p id="timer" class="text-gray-600 mb-6">Time Left: <span id="time">20</span> s</p>
    <div id="question-container" class="text-lg text-gray-800 font-medium"></div>
    <div id="options-container" class="mt-6 grid grid-cols-2 gap-4"></div>
  </div>

  <div id="results-container" class="hidden bg-white shadow-2xl rounded-3xl p-8 max-w-2xl w-full text-center">
    <h2 class="text-3xl font-bold text-indigo-700 mb-4">Lesson Complete!</h2>
    <p class="text-gray-700 mb-4">Your updated ELO rating is:</p>
    <p id="final-elo" class="text-4xl font-extrabold text-green-600"></p>
    <a href="{% url 'lessons' %}" class="inline-block mt-6 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-full hover:bg-indigo-700 transition">Back to Lessons</a>
  </div>

  <script>
    // Initialize or retrieve player ELO
    let playerElo = localStorage.getItem('playerElo') ? parseInt(localStorage.getItem('playerElo')) : 500;

    const K = 32;
    function expectedScore(player, question) {
      return 1 / (1 + Math.pow(10, (question - player) / 400));
    }
    function updateElo(isCorrect, questionElo) {
      const exp = expectedScore(playerElo, questionElo);
      const score = isCorrect ? 1 : 0;
      playerElo = Math.round(playerElo + K * (score - exp));
      localStorage.setItem('playerElo', playerElo);
    }

    const questions = [
      {q: "sin(30°) = ?", options:["1/2","√3/2","√2/2","1"], correct:"1/2", elo:500},
      {q: "cos(60°) = ?", options:["1/2","√3/2","√2/2","0"], correct:"1/2", elo:520},
      {q: "tan(45°) = ?", options:["1","√3","1/√3","0"], correct:"1", elo:530},
      {q: "sin(0°) = ?", options:["0","1","√3/2","1/2"], correct:"0", elo:540},
      {q: "cos(0°) = ?", options:["1","0","1/2","√3/2"], correct:"1", elo:550},
      {q: "sin(90°) = ?", options:["0","1","√3/2","1/2"], correct:"1", elo:560},
      {q: "cos(90°) = ?", options:["0","1","√3/2","1/2"], correct:"0", elo:570},
      {q: "tan(30°) = ?", options:["1/√3","√3","1","0"], correct:"1/√3", elo:600},
      {q: "tan(60°) = ?", options:["√3","1/√3","1","0"], correct:"√3", elo:620},
      {q: "cot(45°) = ?", options:["1","√3","1/√3","0"], correct:"1", elo:640},
      {q: "sin(π/6) = ?", options:["1/2","√3/2","√2/2","0"], correct:"1/2", elo:650},
      {q: "cos(π/3) = ?", options:["1/2","√3/2","√2/2","0"], correct:"1/2", elo:660},
      {q: "tan(π/4) = ?", options:["1","√3","1/√3","0"], correct:"1", elo:670},
      {q: "sin(45°) = ?", options:["√2/2","1/2","√3/2","1"], correct:"√2/2", elo:700},
      {q: "cos(45°) = ?", options:["√2/2","1/2","√3/2","1"], correct:"√2/2", elo:710},
      {q: "sin²θ + cos²θ = ?", options:["1","0","2","sinθ"], correct:"1", elo:740},
      {q: "tanθ = ?", options:["sinθ / cosθ","cosθ / sinθ","1 / sinθ","1 / cosθ"], correct:"sinθ / cosθ", elo:760},
      {q: "If sinθ = 3/5, then cosθ = ?", options:["4/5","3/5","5/4","1/5"], correct:"4/5", elo:800},
      {q: "If cosθ = 4/5, then sinθ = ?", options:["3/5","5/4","4/3","1/5"], correct:"3/5", elo:810},
      {q: "secθ = ?", options:["1/cosθ","1/sinθ","tanθ","cosθ"], correct:"1/cosθ", elo:820},
      {q: "cscθ = ?", options:["1/sinθ","1/cosθ","tanθ","cotθ"], correct:"1/sinθ", elo:830},
      {q: "cotθ = ?", options:["1/tanθ","tanθ","sinθ / cosθ","1 / sinθ"], correct:"1/tanθ", elo:850},
      {q: "If tanA = 3/4, find sinA.", options:["3/5","4/5","5/3","1/3"], correct:"3/5", elo:900},
      {q: "If tanA = 3/4, find cosA.", options:["4/5","3/5","5/4","1/4"], correct:"4/5", elo:910},
      {q: "sin(θ + 90°) = ?", options:["cosθ","-cosθ","sinθ","-sinθ"], correct:"cosθ", elo:940},
      {q: "cos(θ + 90°) = ?", options:["-sinθ","sinθ","cosθ","-cosθ"], correct:"-sinθ", elo:960},
      {q: "tan(θ + 180°) = ?", options:["tanθ","-tanθ","cotθ","-cotθ"], correct:"tanθ", elo:980},
      {q: "sin(270°) = ?", options:["-1","0","1","√3/2"], correct:"-1", elo:1000},
      {q: "cos(180°) = ?", options:["-1","0","1","1/2"], correct:"-1", elo:1020},
      {q: "tan(90°) is?", options:["undefined","0","1","∞"], correct:"undefined", elo:1040},
      {q: "sin(2θ) = ?", options:["2sinθcosθ","sin²θ + cos²θ","cos²θ - sin²θ","tan²θ"], correct:"2sinθcosθ", elo:1100},
      {q: "cos(2θ) = ?", options:["cos²θ - sin²θ","sin²θ - cos²θ","2sinθcosθ","1 - 2sin²θ"], correct:"cos²θ - sin²θ", elo:1120},
      {q: "tan(2θ) = ?", options:["2tanθ / (1 - tan²θ)","tan²θ / 2","(1 - tan²θ)/2tanθ","tan²θ"], correct:"2tanθ / (1 - tan²θ)", elo:1140},
      {q: "sin(−θ) = ?", options:["−sinθ","sinθ","−cosθ","cosθ"], correct:"−sinθ", elo:1200},
      {q: "cos(−θ) = ?", options:["cosθ","−cosθ","sinθ","−sinθ"], correct:"cosθ", elo:1220},
      {q: "tan(−θ) = ?", options:["−tanθ","tanθ","cotθ","−cotθ"], correct:"−tanθ", elo:1240},
      {q: "sin(π/2 − θ) = ?", options:["cosθ","sinθ","tanθ","1"], correct:"cosθ", elo:1260},
      {q: "cos(π/2 − θ) = ?", options:["sinθ","cosθ","tanθ","1"], correct:"sinθ", elo:1280},
      {q: "tan(π/2 − θ) = ?", options:["cotθ","tanθ","sinθ","cosθ"], correct:"cotθ", elo:1300},
      {q: "sin(A+B) = ?", options:["sinAcosB + cosAsinB","sinAcosB - cosAsinB","sinA + sinB","cosA + cosB"], correct:"sinAcosB + cosAsinB", elo:1350},
      {q: "cos(A+B) = ?", options:["cosAcosB - sinAsinB","cosAcosB + sinAsinB","sinAcosB + cosAsinB","tanA + tanB"], correct:"cosAcosB - sinAsinB", elo:1370},
      {q: "tan(A+B) = ?", options:["(tanA+tanB)/(1−tanAtanB)","tanA+tanB","(tanA−tanB)/(1+tanAtanB)","1/(tanA+tanB)"], correct:"(tanA+tanB)/(1−tanAtanB)", elo:1400},
      {q: "sec²θ − tan²θ = ?", options:["1","0","2","sin²θ"], correct:"1", elo:1420},
      {q: "1 + tan²θ = ?", options:["sec²θ","csc²θ","cos²θ","sin²θ"], correct:"sec²θ", elo:1440},
      {q: "1 + cot²θ = ?", options:["csc²θ","sec²θ","tan²θ","cos²θ"], correct:"csc²θ", elo:1460},
      {q: "sin(360°) = ?", options:["0","1","−1","1/2"], correct:"0", elo:1500},
      {q: "If sinA = 0.6, cosA = ?", options:["0.8","0.6","1","0.5"], correct:"0.8", elo:1520},
      {q: "Find θ if cosθ = 0.", options:["90°","0°","180°","45°"], correct:"90°", elo:1600},
      {q: "If tanθ = 1, θ = ?", options:["45°","30°","60°","90°"], correct:"45°", elo:1620},
      {q: "cos²θ = 1 − ?", options:["sin²θ","tan²θ","cot²θ","sec²θ"], correct:"sin²θ", elo:1650},
      {q: "If sinA = 1, A = ?", options:["90°","0°","45°","60°"], correct:"90°", elo:1700},
      {q: "If cosA = 1, A = ?", options:["0°","90°","180°","45°"], correct:"0°", elo:1720},
      {q: "If tanA = 0, A = ?", options:["0°","90°","180°","45°"], correct:"0°", elo:1740},
      {q: "sin(π) = ?", options:["0","1","−1","√3/2"], correct:"0", elo:1780},
      {q: "cos(π) = ?", options:["−1","1","0","√3/2"], correct:"−1", elo:1800},
      {q: "tan(π) = ?", options:["0","1","undefined","∞"], correct:"0", elo:1820},
      {q: "sin(3π/2) = ?", options:["−1","0","1","√3/2"], correct:"−1", elo:1850},
      {q: "cos(3π/2) = ?", options:["0","1","−1","√3/2"], correct:"0", elo:1870},
      {q: "tan(3π/2) = ?", options:["undefined","0","1","∞"], correct:"undefined", elo:1900},
      {q: "sin(2π) = ?", options:["0","1","−1","√3/2"], correct:"0", elo:1950},
      {q: "cos(2π) = ?", options:["1","0","−1","√3/2"], correct:"1", elo:1970},
      {q: "tan(2π) = ?", options:["0","1","undefined","∞"], correct:"0", elo:2000}
    ];

    // Select 7 random questions per lesson
    const selectedQuestions = questions.sort(() => Math.random() - 0.5).slice(0, 7);

    let currentQuestion = 0, timeLeft = 20, timer;

    function startTimer() {
      clearInterval(timer);
      timeLeft = 20;
      document.getElementById('time').innerText = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          updateElo(false, selectedQuestions[currentQuestion].elo);
          nextQuestion();
        }
      }, 1000);
    }

    function showQuestion() {
      const q = selectedQuestions[currentQuestion];
      document.getElementById('question-container').innerText = q.q;
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-xl transition";
        btn.innerText = opt;
        btn.onclick = () => {
          clearInterval(timer);
          updateElo(opt === q.correct, q.elo);
          nextQuestion();
        };
        optionsContainer.appendChild(btn);
      });
      startTimer();
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < selectedQuestions.length) showQuestion();
      else showResults();
    }

    function showResults() {
      document.getElementById('lesson-container').classList.add('hidden');
      document.getElementById('results-container').classList.remove('hidden');
      document.getElementById('final-elo').innerText = playerElo;
    }

    showQuestion();
  </script>
</body>
</html>
