<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-3xl w-full bg-white shadow-2xl rounded-3xl p-8 text-center">
    <h1 class="text-4xl font-bold text-indigo-700 mb-6">ADA Dashboard</h1>
    <p class="text-gray-700 mb-6">Your ELO rating: <span id="player-elo" class="font-semibold text-green-600"></span></p>

    <div class="grid grid-cols-2 gap-6 mb-6">
      <a href="{% url 'lessons' %}" class="px-6 py-4 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-2xl transition">Lessons</a>
      <a href="{% url 'competitive' %}" class="px-6 py-4 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-2xl transition">Competitive</a>
      <a href="{% url 'profile' %}" class="px-6 py-4 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-2xl transition">Profile</a>
      <a href="{% url 'leaderboard' %}" class="px-6 py-4 bg-gray-400 text-white font-semibold rounded-2xl">Leaderboard</a>
  </div>

  <script>
    // Display current player ELO on home dashboard
    const playerElo = localStorage.getItem('playerElo') ? parseInt(localStorage.getItem('playerElo')) : 500;
    document.getElementById('player-elo').innerText = playerElo;
  </script>
</body>
</html>
